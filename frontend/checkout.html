<!DOCTYPE html>
<html>

<head>
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="checkout-container">

        <h1>Checkout</h1>

        <input
            type="text"
            id="customerName"
            placeholder="Full Name"
        >

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
        >

        <textarea
            id="address"
            placeholder="Full Address">
        </textarea>

        <input
            type="text"
            id="city"
            placeholder="City"
        >

        <input
            type="text"
            id="pincode"
            placeholder="Pincode"
        >

        <h3>
            Payment Method:
            Cash On Delivery
        </h3>

        <button onclick="placeOrder()">
            Place Order
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
