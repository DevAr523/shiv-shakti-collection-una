<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shiv Shakti Collection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">

        <div class="logo"
             onclick="goHome()">
            Shiv Shakti Collection
        </div>

        <input
            type="text"
            placeholder="Search products..."
            class="search-box"
        >

        <div class="nav-buttons">

            <button onclick="goHome()">
                Home
            </button>

            <button onclick="goToCart()">
                🛒 Cart
                (<span id="cart-count">0</span>)
            </button>

        </div>

    </div>

    <!-- HERO -->
    <div class="hero">

        <div class="hero-text">

            <h1>
                Welcome to Shiv Shakti Collection
            </h1>

            <p>
                Fashion That Matches Your Style
            </p>

        </div>

    </div>

    <!-- CATEGORY FILTER -->
    <div class="filters">

        <button onclick="filterCategory('All')">
            All
        </button>

        <button onclick="filterCategory('Men')">
            Men
        </button>

        <button onclick="filterCategory('Women')">
            Women
        </button>

        <button onclick="filterCategory('Kids')">
            Kids
        </button>

    </div>

    <!-- PRODUCTS -->
    <h2 class="section-title">
        Trending Products
    </h2>

    <div id="product-list"></div>

    <script src="script.js"></script>

</body>

</html>
