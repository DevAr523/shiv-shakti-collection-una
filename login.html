<!DOCTYPE html>
<html>
<body>

<input id="username" placeholder="Username"><br>
<input id="password" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

<script>
async function login() {

    const res =
    await fetch(
        "https://shiv-shakti-backend-h9yl.onrender.com/login",
        {
            method: "POST",

            headers: {
                "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
                username:
                username.value,

                password:
                password.value
            })
        }
    );

    const data =
    await res.json();

    if (res.ok) {

        localStorage.setItem(
            "token",
            data.token
        );

        window.location.href =
        "admin.html";

    } else {

        alert(
            data.message
            || "Login failed"
        );
    }
}
</script>

</body>
</html>
