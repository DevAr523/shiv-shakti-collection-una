<!DOCTYPE html>
<html lang="en">
    <head>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

#username,
#password {
    padding: 10px;
    width: 250px;
}

button {
    padding: 10px;
}
</style>
<title> Login Page </title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="login-container">

        <div class="loginlogo">
            Admin Login Page
        </div>
 
<input id="username" placeholder="Username"><br>
<input id="password" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

 </div>
<script>
async function login() {

    const res =
    await fetch(
        "https://shiv-shakti-backend-h9yl.onrender.com/login",
        {
            method: "POST",

            headers: {
                "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
                username:
                username.value,

                password:
                password.value
            })
        }
    );

    const data =
    await res.json();

    if (res.ok) {

        localStorage.setItem(
            "token",
            data.token
        );

        window.location.href =
        "admin.html";

    } else {

        alert(
            data.message
            || "Login failed"
        );
    }
}
</script>

</body>
</html>
